name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.moodle-branch }}
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
        moodle-branch: ['MOODLE_405_STABLE']

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ../ci ^4
          echo "$(cd ../ci && pwd)/bin"        >> "$GITHUB_PATH"
          echo "$(cd ../ci && pwd)/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle + plugin
        run: |
          DOCKER_BRIDGE=$(docker network inspect bridge \
            --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null || echo "172.17.0.1")
          echo "MOODLE_URL=http://${DOCKER_BRIDGE}:8000" >> "$GITHUB_ENV"
          moodle-plugin-ci install \
            --moodle ../moodle \
            --data ../moodledata \
            --plugin . \
            --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOODLE_URL: "http://172.17.0.1:8000"

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint .

      - name: Validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate .

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --moodle ../moodle --fail-on-warning .

      - name: Behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --moodle ../moodle --profile chrome --start-servers .
